name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build-only for now. The test suite arrives in Phase 8 (RSpec + Playwright)
# and gets its own jobs here then.
jobs:
  api:
    name: abono-api
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image so the enable_extension "vector" migration can run.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abono_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres

    defaults:
      run:
        working-directory: abono-api

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: abono-api
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Check eager loading
        run: bin/rails zeitwerk:check

  web:
    name: abono-web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: abono-web

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: abono-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
